.upd{font-size:13px;opacity:.8;text-align:right;letter-spacing:.03em}
main{padding:16px 28px 32px;max-width:1600px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 16px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.kl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.kv{font-size:38px;font-weight:800;line-height:1}
.ks{font-size:13px;opacity:.75}
.ok{color:var(--green)}.bad{color:#E5A3A0}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px;margin:0 0 12px;opacity:.9}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tw{overflow:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:17px;background:rgba(255,255,255,.05)}
thead th{position:sticky;top:0;background:#0B3040;padding:10px 6px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:14px;text-align:right;white-space:nowrap;border-bottom:2px solid var(--teal)}
thead th.l{text-align:left}
thead th.sep,td.sep{border-left:2px solid rgba(255,255,255,.25)}
td{padding:6px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
td.l{text-align:left;font-weight:600;letter-spacing:.02em}
tbody tr:hover{background:rgba(255,255,255,.08)}
td.c9{color:#7CE3D6;font-weight:700}
td.cl{color:#E5A3A0}
td.z{opacity:.35}
.pg{font-weight:800;border-radius:6px}
.pg.g{background:rgba(45,197,180,.4);color:#fff}
.pg.r{background:rgba(220,88,84,.6);color:#fff}
td.p{opacity:.85}
tfoot td{font-weight:800;background:#0B3040;border-top:2px solid var(--teal);position:sticky;bottom:0}
.foot{margin-top:18px;font-size:14px;opacity:.65;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.legend{align-items:center}
.rl{font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;margin-right:8px}
.rb{font-family:inherit;font-size:16px;font-weight:700;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 16px;margin-left:6px;cursor:pointer}
.rb.on{background:#2DC5B4;border-color:#2DC5B4}
.fbar{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.fbar label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;display:block;margin-bottom:3px}
.fbar select{font-family:inherit;font-size:17px;font-weight:600;background:#0B3040;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:5px 12px;min-width:260px}
.fbar .rb{font-size:17px;padding:4px 18px}
.srt{background:rgba(45,197,180,.25);color:#fff;border:1px solid rgba(45,197,180,.7);border-radius:6px;font-size:12px;line-height:1;padding:3px 6px;margin-left:4px;cursor:pointer}
.srt:hover{background:#2DC5B4}
.pior{margin:3px 0 0 16px;font-size:12px;line-height:1.25;font-weight:600;letter-spacing:0}
.pior li{break-inside:avoid;white-space:nowrap}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.2fr) minmax(0,1.5fr);gap:10px}}
.kpis .card{padding:9px 12px}
.kpis .kl{font-size:12px;letter-spacing:.04em;line-height:1.1}
.kpis .kv{font-size:clamp(26px,2.7vw,38px)}
.kpis .ks{font-size:12px}
.rg{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;line-height:1.25;margin-top:3px}
.rg b{font-size:clamp(20px,1.9vw,26px);font-weight:800}
.pior{font-size:11px;margin-left:14px}

.pior li::marker{color:#E5A3A0;font-weight:800}
.hist{margin-top:18px}
.hh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.hh h2{font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.hh h2 span{font-weight:400;color:var(--teal)}
.hh label{font-size:14px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;display:block;margin-bottom:3px}
.hh select{font-family:inherit;font-size:18px;font-weight:600;background:#0B3040;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 12px;min-width:280px}
.hs{display:flex;gap:22px;flex-wrap:wrap;margin:2px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.9}
.hs b{display:block;font-size:21px;line-height:1;letter-spacing:0;color:#fff}
#chart svg{width:100%;height:auto;display:block}
#chart text{font-family:'Barlow Condensed',sans-serif;fill:rgba(255,255,255,.8)}
@media(max-width:700px){.hero,main{padding-left:16px;padding-right:16px}table{font-size:15px}}
</style>
</head>

h+=`</tbody><tfoot><tr><td class="l" colspan="2">Total geral</td><td>${fmt(T.h09)}</td><td>${fmt(T.h10)}</td><td>${fmt(T.h11)}</td><td>${fmt(T.h12)}</td><td>${fmt(T.dem)}</td><td>${fmt(T.t)}</td><td class="sep"><span class="pg ${p>=META?'g':'r'}" style="display:block;padding:2px 8px">${p}%</span></td>`+
cols.slice(1).map(k=>`<td>${pr(T[k],T.t)}</td>`).join('')+'</tr></tfoot>';
document.getElementById('tb').innerHTML=h;
document.getElementById('ord').textContent='Ordenado do '+(SORT===1?'menor para o maior':'maior para o menor')+' % até 09h';
}
document.getElementById('tb').addEventListener('click',e=>{if(e.target.closest('#srt')){SORT=-SORT;render();}});
render();
// ---------- Histórico diário (% até 09h) ----------
const HIST=DATA.historico||[];
const selF=document.getElementById('selF');
function popularFilial(){const nomes=[...new Set([...HIST,...DATA.filiais.map(f=>({f:f.nome,r:f.reg}))].filter(x=>!REG||x.r===REG).map(x=>x.f))].sort();const at=selF.value;
  selF.innerHTML='<option value="">Todas as filiais'+(REG?' — '+REG:'')+' (consolidado)</option>'+nomes.map(n=>`<option value="${n}">${n}</option>`).join('');selF.value=nomes.includes(at)?at:'';}
popularFilial();
const dm=d=>d.slice(8,10)+'/'+d.slice(5,7);
function serie(f){const m={};HIST.filter(x=>(!f||x.f===f)&&(!REG||x.r===REG)).forEach(x=>{const o=m[x.d]||(m[x.d]={d:x.d,h:0,t:0,parcial:!!x.parcial});o.h+=x.h;o.t+=x.t;});
  return Object.values(m).sort((a,b)=>a.d.localeCompare(b.d)).map(o=>({...o,p:o.t?o.h/o.t*100:0}));}
function desenha(){
  const s=serie(selF.value).map(o=>({...o,dom:new Date(o.d+'T12:00:00').getDay()===0})), fin=s.filter(o=>!o.parcial&&!o.dom);
  const med=fin.length?fin.reduce((a,o)=>a+o.p,0)/fin.length:0;
  const best=fin.length?fin.reduce((a,o)=>o.p>a.p?o:a):null, worst=fin.length?fin.reduce((a,o)=>o.p<a.p?o:a):null;
  document.getElementById('hs').innerHTML=
    `<div>Média do período<b class="${Math.round(med)>=META?'ok':'bad'}">${Math.round(med)}%</b></div>`+
    `<div>Melhor dia<b class="${best&&Math.round(best.p)>=META?'ok':'bad'}">${best?Math.round(best.p)+'% · '+dm(best.d):'–'}</b></div>`+
    `<div>Pior dia<b class="${worst&&Math.round(worst.p)>=META?'ok':'bad'}">${worst?Math.round(worst.p)+'% · '+dm(worst.d):'–'}</b></div>`+
    `<div>Dias no histórico<b>${fin.length}</b></div>`;
  const W=900,H=250,L=44,R=18,T=18,B=34,iw=W-L-R,ih=H-T-B;
  const X=i=>L+30+(s.length<2?(iw-60)/2:i*(iw-60)/(s.length-1)), Y=v=>T+ih-v/100*ih;
  let g='';
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.15)"/><text x="${L-8}" y="${Y(v)+5}" text-anchor="end" font-size="14">${v}%</text>`;});
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(90)}" y2="${Y(90)}" stroke="#fff" stroke-opacity=".55" stroke-dasharray="6 5"/><text x="${L+6}" y="${Y(90)-5}" text-anchor="start" font-size="13">Meta ${META}%</text>`;
  const cor=v=>Math.round(v)>=META?'#2DC5B4':'#E0605C', corT=v=>Math.round(v)>=META?'#7CF0E2':'#FF9C97';
  const pts=s.map((o,i)=>[X(i),Y(o.p)]);
  const fp=pts.filter((_,i)=>!s[i].parcial&&!s[i].dom);
  if(fp.length>1) g+=`<polyline fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linejoin="round" points="${fp.map(q=>q.join(',')).join(' ')}"/>`;
  const passo=Math.ceil(s.length/12), rot=s.length<=20;
  s.forEach((o,i)=>{const [x,y]=pts[i];
    g+=(o.parcial||o.dom)?`<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="${cor(o.p)}" stroke-width="2.5" stroke-dasharray="3 2"><title>${dm(o.d)} (${o.parcial?'parcial':'domingo, fora da média'}): ${o.p.toFixed(1)}%</title></circle>`
                :`<circle cx="${x}" cy="${y}" r="6" fill="${cor(o.p)}"><title>${dm(o.d)}: ${o.p.toFixed(1)}% (${o.h.toLocaleString('pt-BR')} de ${o.t.toLocaleString('pt-BR')})</title></circle>`;
    if(rot) g+=`<text x="${x}" y="${y-11}" text-anchor="middle" font-size="14" font-weight="700" style="fill:${corT(o.p)}">${Math.round(o.p)}%${(o.parcial||o.dom)?'*':''}</text>`;
    if(i%passo===0||i===s.length-1) g+=`<text x="${x}" y="${H-10}" text-anchor="middle" font-size="14">${dm(o.d)}</text>`;});
  document.getElementById('chart').innerHTML=s.length?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução diária do percentual expedido até 09h">${g}</svg>`+(s.some(o=>o.parcial||o.dom)?'<div style="font-size:13px;opacity:.7">* '+[s.some(o=>o.parcial)?'dia em andamento (parcial)':'',s.some(o=>o.dom)?'domingo':''].filter(Boolean).join(' e ')+' não entra na média</div>':''):'<div style="opacity:.7;padding:20px">Sem histórico ainda.</div>';
}
selF.addEventListener('change',()=>{FIL=selF.value;render();desenha();}); desenha();
const regs=[...new Set(DATA.filiais.map(f=>f.reg))].sort();
const rs=document.getElementById('regsel');
rs.innerHTML='<span class="rl">Regional</span>'+['',...regs].map(r=>`<button class="rb${r===REG?' on':''}" data-r="${r}">${r||'Todas'}</button>`).join('');
rs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;REG=b.dataset.r;rs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));popularFilial();FIL=selF.value;render();desenha();});
</script>
</body>
</html>
